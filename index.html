    <link rel="stylesheet" crossorigin href="./index-yjx1XzyB.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Show a readable message instead of a white screen if the app cannot start.
      (function () {
        function show(msg) {
          var r = document.getElementById('root');
          if (r && !r.children.length) {
            r.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:24px;line-height:1.5"><h2 style="margin:0 0 8px">App could not start</h2><p style="margin:0 0 8px">' + msg + '</p><p style="color:#5B6663;font-size:13px">Try: reload the page, or clear this site\'s data in the browser. Send this message to your developer.</p></div>';
          }
        }
        window.addEventListener('error', function (e) {
          var t = e.target && (e.target.src || e.target.href);
          show(t ? 'Could not load: ' + t : String(e.message || 'Unknown error'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () { show('The app did not render within 5 seconds.'); }, 5000);
      })();
    </script>
  </body>
</html>
